# HSTS (2 ans). La CSP et les autres en-têtes sont envoyés par Next.js et Strapi eux-mêmes.
# Attention : un add_header dans un bloc location annule ceux du bloc parent,
# d'où l'inclusion répétée de ce fichier dans les locations qui ajoutent leurs propres en-têtes.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
