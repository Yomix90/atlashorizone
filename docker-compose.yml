# Déploiement VPS : PostgreSQL + Strapi + Next.js + Nginx (HTTPS Let's Encrypt).
# Toute la configuration vient du fichier .env à la racine (copie de .env.example).
# Premier déploiement : voir README, section « Déploiement » (deploy/scripts/init-letsencrypt.sh puis deploy.sh).

name: atlas-horizons

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  strapi:
    build:
      context: ./backend
      args:
        PUBLIC_URL: https://${CMS_DOMAIN}
    image: atlas-horizons/strapi:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://${CMS_DOMAIN}
      IS_PROXIED: 'true'
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_API_TOKEN: ${FRONTEND_API_TOKEN}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: 'false'
      CORS_ORIGINS: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN},https://${CMS_DOMAIN}
      CSP_MEDIA_SOURCES: ${CSP_MEDIA_SOURCES:-}
      # Revalidation ISR : appel interne direct au conteneur Next.js
      FRONTEND_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      AGENCY_EMAIL_LOCALE: ${AGENCY_EMAIL_LOCALE:-fr}
      RESERVATION_PREFIX: ${RESERVATION_PREFIX:-AHV}
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER:-local}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY:-}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_CDN_URL: ${S3_CDN_URL:-}
      STRAPI_PLUGIN_I18N_INIT_LOCALE_CODE: fr
      STRAPI_TELEMETRY_DISABLED: 'true'
    volumes:
      - uploads:/opt/app/public/uploads
    # Exposé uniquement en local : utilisé par le build du front (pré-génération des pages).
    ports:
      - '127.0.0.1:1337:1337'
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      # Accès à Strapi (127.0.0.1:1337) pendant le build pour pré-générer les pages.
      network: host
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_MEDIA_URL: https://${CMS_DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GA_ID: ${GA_ID:-}
        EXTRA_IMAGE_HOSTS: ${EXTRA_IMAGE_HOSTS:-}
        STRAPI_API_URL: http://127.0.0.1:1337
      secrets:
        - strapi_api_token
    image: atlas-horizons/frontend:latest
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STRAPI_API_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${FRONTEND_API_TOKEN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - strapi
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot:ro
    # Recharge la configuration toutes les 6 h pour prendre en compte les certificats renouvelés.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & /docker-entrypoint.sh nginx -g 'daemon off;'"
    networks: [internal]

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

secrets:
  strapi_api_token:
    environment: FRONTEND_API_TOKEN

volumes:
  pgdata:
  uploads:
  letsencrypt:
  certbot-www:

networks:
  internal:
